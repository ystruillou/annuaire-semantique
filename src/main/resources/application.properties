spring.application.name=annuaire-semantique
server.port=8096

# --- Base RDF ---
# Adresse d'un serveur Fuseki (par exemple http://localhost:3030/annuaire). Vide : base TDB2 locale.
annuaire.rdf.fuseki=${ANNUAIRE_FUSEKI:}
# Dossier de la base TDB2 locale. Vide : base en mémoire.
annuaire.rdf.dossier=${ANNUAIRE_RDF_DOSSIER:donnees/tdb2}

# --- Elasticsearch ---
annuaire.elasticsearch.url=${ANNUAIRE_ELASTICSEARCH:http://localhost:9200}
annuaire.elasticsearch.index=entites

# --- Source externe ---
annuaire.sirene.url=https://recherche-entreprises.api.gouv.fr

# --- Administration : jeton exigé pour toute écriture (16 caractères au moins) ---
annuaire.admin.jeton=${ANNUAIRE_ADMIN_JETON:}

# --- Base relationnelle (configuration des widgets) ---
# Par défaut : H2 en fichier, en mode PostgreSQL, pour développer sans serveur.
# En production : PostgreSQL, par les variables SPRING_DATASOURCE_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./donnees/h2/annuaire;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.graphql.graphiql.enabled=true
server.error.include-message=always

# Remplit une base vide avec des données fictives (démonstration).
annuaire.exemple=${ANNUAIRE_EXEMPLE:false}
